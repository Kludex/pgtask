[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "pgtask"
dynamic = ["version"]
description = "PostgreSQL-native durable tasks and workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["opentelemetry-api>=1.30", "psycopg>=3.2"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]

[dependency-groups]
dev = [
  "anyio>=4.10",
  "maturin>=1.10,<2.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "psycopg[binary]>=3.2",
  "ruff>=0.12",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "pgtask._native"
features = ["pyo3/abi3-py310", "pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source_pkgs = ["pgtask", "tests"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "FA", "UP", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true
