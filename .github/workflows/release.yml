name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          RELEASE_VERSION="$version" ./scripts/check-release-version.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: pgtask
          POSTGRES_PASSWORD: pgtask
          POSTGRES_USER: pgtask
        options: >-
          --health-cmd "pg_isready -U pgtask -d pgtask"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      PGTASK_DATABASE_URL: postgresql://pgtask:pgtask@localhost:5432/pgtask
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  wheels:
    needs: [version, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.11.5
          rust-toolchain: "1.94"
          args: --release --locked --compatibility pypi --out dist
      - run: uv pip install --system --no-deps --no-index --find-links dist pgtask
      - run: python -c "import pgtask; assert pgtask.Client"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    needs: [version, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  python:
    needs: [version, wheels, source-distribution]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: [version, quality]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - run: npm publish "pgtask-client-${{ needs.version.outputs.version }}.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdks/typescript/*.tgz
          if-no-files-found: error

  crates:
    needs: [version, quality]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - run: |
          set -eu
          cargo publish --locked -p pgtask-core
          cargo publish --locked -p pgtask-otel
          cargo publish --locked -p pgtask-postgres
          cargo publish --locked -p pgtask-worker
          cargo publish --locked -p pgtask
          cargo publish --locked -p pgtask-cli
          cargo publish --locked -p pgtask-web

  image:
    needs: [version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE@$DIGEST"

  chart:
    needs: [version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/pgtask --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/pgtask-$VERSION.tgz" "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts"
          chart="ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/pgtask:$VERSION"
          cosign sign --yes "$chart"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$chart"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [version, wheels, source-distribution, python, npm, crates, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
