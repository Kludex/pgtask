name: Release

on:
  release:
    types: ["published"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="${TAG#v}"
          case $version in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *)
                  echo "release tag $TAG is not vMAJOR.MINOR.PATCH" >&2
                  exit 1
                  ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: pgtask
          POSTGRES_PASSWORD: pgtask
          POSTGRES_USER: pgtask
        options: >-
          --health-cmd "pg_isready -U pgtask -d pgtask"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      PGTASK_DATABASE_URL: postgresql://pgtask:pgtask@localhost:5432/pgtask
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  wheels:
    needs: [version, quality]
    runs-on: ${{ matrix.os }}
    # Windows defaults to PowerShell, which dot-sources a shell script instead of running it, so the
    # version step would report success without having changed a thing.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          working-directory: sdks/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.11.5
          rust-toolchain: "1.94"
          args: --release --locked --compatibility pypi --out ../../dist
      # Install with dependencies: the package imports opentelemetry, so a --no-deps install
      # cannot even be imported, which is what this step exists to check.
      - run: uv pip install --system --find-links dist "pgtask==${{ needs.version.outputs.version }}"
      - run: python -c "import pgtask; assert pgtask.Client"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  source-distribution:
    needs: [version, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv build --project sdks/python --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  python:
    needs: [version, wheels, source-distribution]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: [version, quality]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        working-directory: .
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack
      # Skip a version the registry already has, so a partial release can be rerun. This is the
      # same tolerance publish-crates.sh applies to crates.io.
      - name: Publish to npm unless the version is already there
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          if npm view "@pgtask/client@$VERSION" version >/dev/null 2>&1; then
            echo "@pgtask/client@$VERSION is already published"
          else
            npm publish "pgtask-client-$VERSION.tgz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sdks/typescript/*.tgz
          if-no-files-found: error

  crates:
    needs: [version, quality]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - run: ./scripts/publish-crates.sh "${{ needs.version.outputs.version }}"

  # Each architecture builds on its own runner. Emulating aarch64 for a release build of the whole
  # workspace took over an hour and was still going, so the manifest is assembled from digests
  # instead.
  image:
    needs: [version, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            os: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
          outputs: type=image,name=ghcr.io/${{ steps.registry.outputs.owner }}/pgtask,push-by-digest=true,name-canonical=true,push=true
      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pgtask
          sources=()
          for digest in digests/*; do
            sources+=("$image@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag "$image:$VERSION" "${sources[@]}"
          manifest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$image@$manifest"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image@$manifest"

  chart:
    needs: [version, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set the release version from the tag
        run: ./scripts/set-release-version.sh "${{ needs.version.outputs.version }}"
      - uses: azure/setup-helm@v5
        with:
          version: v4.1.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      # helm keeps its own registry credentials, and cosign reads the docker ones.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          owner=${GITHUB_REPOSITORY_OWNER,,}
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/pgtask --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/pgtask-$VERSION.tgz" "oci://ghcr.io/$owner/charts"
          chart="ghcr.io/$owner/charts/pgtask:$VERSION"
          cosign sign --yes "$chart"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$chart"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [version, wheels, source-distribution, python, npm, crates, image-manifest, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          go_tag="sdks/go/$TAG"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$go_tag" >/dev/null 2>&1; then
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/$go_tag" \
              --field sha="$GITHUB_SHA"
          fi
          # This job never checks the repository out, so gh has to be told which one to upload to.
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
