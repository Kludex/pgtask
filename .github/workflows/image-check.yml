name: image-check

on: workflow_dispatch

# A rehearsal of the release image jobs against a throwaway tag, so a broken manifest or signature
# is found without spending a version number.
jobs:
  image:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            os: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}
          outputs: type=image,name=ghcr.io/${{ steps.registry.outputs.owner }}/pgtask,push-by-digest=true,name-canonical=true,push=true
      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - env:
          VERSION: 0.0.0-image-check
        run: |
          set -eu
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pgtask
          sources=()
          for digest in digests/*; do
            sources+=("$image@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag "$image:$VERSION" "${sources[@]}"
          manifest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$image:$VERSION"
          cosign sign --yes "$image@$manifest"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image-check.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image@$manifest"
