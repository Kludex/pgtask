name: Torture test

# Runs the verification stack much harder than PR-time CI does: higher
# proptest / state-machine case counts, several independent legs each on
# its own fresh database (a fresh service container isolates one leg's
# run from another's, though not from the other test files it shares a
# database with within the same leg -- see KNOWN_FLAKY_TESTS below), the
# linearizability checker with fault injection, the TLA+ specs, and
# (weekly, or on request) the SQL mutation-testing sweep.
#
# `schedule:` only fires from the default branch, same as any other
# workflow here.

on:
  schedule:
    # Nightly stress run.
    - cron: "17 3 * * *"
    # Weekly: the same, plus the SQL mutation-testing sweep (expensive enough
    # that it does not belong in every nightly run).
    - cron: "37 4 * * 0"
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: proptest cases per property test (each of 6 legs)
        type: string
        default: "20000"
      model_cases:
        description: proptest-state-machine cases per leg
        type: string
        default: "400"
      run_mutation:
        description: also run the SQL mutation-testing sweep
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  # Known, already-triaged flakes -- not what this workflow exists to catch.
  #   task_transitions_only_notify_their_deterministic_shards: measured host
  #     jitter, not a correctness bug. See #25 and
  #     scripts/sql-mutation-test.py's own FLAKY_TESTS list, which this
  #     mirrors.
  #   interval_schedule_reconciles_materializes_and_supports_dynamic_crud:
  #     shares a database with every other file `cargo test --workspace`
  #     runs, and `claim_due_schedules` has no per-queue limit -- enough
  #     schedules from other files (there are more of them at the
  #     PROPTEST_CASES this workflow uses) starve this test's own schedule
  #     out of the sweep. See #39. A fresh database per leg does not help:
  #     the contamination is between test *files* sharing one leg's
  #     database, not between separate runs.
  #   administrator_mode_mutates_through_audited_post_operations,
  #   observer_pages_cover_queues_tasks_schedules_workers_and_not_found,
  #   application_runs_with_a_role_that_can_only_read_observer_views:
  #     /schedules and /workers render every row ever, unpaginated, and
  #     the test harness's own 1MB response-body limit is what actually
  #     trips once enough schedules exist in the shared database. Real
  #     production concern, not just a test artifact -- see #42. Skipped
  #     here for the same reason as #39: an already-filed, already-
  #     understood failure re-flagging every night is noise, not signal.
  KNOWN_FLAKY_TESTS: >-
    task_transitions_only_notify_their_deterministic_shards
    interval_schedule_reconciles_materializes_and_supports_dynamic_crud
    administrator_mode_mutates_through_audited_post_operations
    observer_pages_cover_queues_tasks_schedules_workers_and_not_found
    application_runs_with_a_role_that_can_only_read_observer_views

jobs:
  rust-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pgtask
          POSTGRES_PASSWORD: pgtask
          POSTGRES_USER: pgtask
        options: >-
          --health-cmd "pg_isready -U pgtask -d pgtask"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      PGTASK_DATABASE_URL: postgresql://pgtask:pgtask@localhost:5432/pgtask
      PROPTEST_CASES: ${{ inputs.proptest_cases || '20000' }}
      PGTASK_MODEL_CASES: ${{ inputs.model_cases || '400' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-10 -- no version tags, needs periodic re-pinning
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: leg-${{ matrix.leg }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache-dependency-path: scripts/linearizability/go.sum
      # Each leg gets its own service container (a fresh runner VM), so this
      # is a distinct random seed and a guaranteed-empty database per leg.
      # That only isolates *across* legs, not within one: every test binary
      # in this one `cargo test --workspace` still shares this leg's single
      # database, which is exactly the contamination behind #39.
      - run: cargo run -p pgtask-cli --bin pgtask -- --database-url "$PGTASK_DATABASE_URL" migrate
      - name: cargo test --workspace
        run: |
          skip_args=()
          for name in $KNOWN_FLAKY_TESTS; do
            skip_args+=(--skip "$name")
          done
          # --no-fail-fast: a torture run exists to surface everything wrong
          # tonight, not to stop at the first test binary that fails and hide
          # whatever the next one would have found.
          cargo test --workspace --all-features --no-fail-fast -- "${skip_args[@]}"
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: torture-evidence-leg-${{ matrix.leg }}
          path: |
            **/*.proptest-regressions
            /tmp/pgtask-*.json
            /tmp/pgtask-*.html
          if-no-files-found: ignore
          retention-days: 30

  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: ./scripts/fetch-tla-tools.sh
      - run: ./scripts/check-tla.sh
      - run: ./scripts/verify-tla-coverage.sh

  mutation:
    if: >-
      github.event.schedule == '37 4 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_mutation == true)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09-10 -- no version tags, needs periodic re-pinning
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # sql-mutation-test.py drives Postgres via `docker exec pgtask-verify`
      # and hardcodes port 54329, so it needs a container by that name on
      # that port rather than the usual `services:` sidecar.
      - name: Start pgtask-verify
        run: |
          docker run -d --name pgtask-verify \
            -e POSTGRES_USER=pgtask -e POSTGRES_PASSWORD=pgtask -e POSTGRES_DB=postgres \
            -p 54329:5432 postgres:17
          for _ in $(seq 1 30); do
            docker exec pgtask-verify pg_isready -U pgtask -q && exit 0
            sleep 1
          done
          echo "postgres never became ready" >&2
          exit 1
      - name: Run the mutation sweep
        run: |
          set -o pipefail
          ./scripts/sql-mutation-test.py | tee mutation-output.log
      - name: Fail on any surviving mutant
        if: always()
        run: |
          # The script itself always exits 0 once the baseline is green --
          # a surviving mutant is a coverage gap, not a script bug, and it
          # prints a report rather than failing. Gate the job on that report
          # instead of the script's exit code.
          if [ -f mutation-output.log ] && grep -q "SURVIVING mutants" mutation-output.log; then
            echo "::error::one or more mutants survived -- see the log above"
            exit 1
          fi
      - name: Save mutation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-output
          path: mutation-output.log
          if-no-files-found: ignore
          retention-days: 30

  # A single required-looking job so the Actions tab shows one clear
  # pass/fail for the whole night rather than six matrix legs plus two more.
  torture:
    needs: [rust-stress, tla, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RUST_STRESS_RESULT: ${{ needs.rust-stress.result }}
          TLA_RESULT: ${{ needs.tla.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
        run: |
          echo "rust-stress: $RUST_STRESS_RESULT"
          echo "tla:         $TLA_RESULT"
          echo "mutation:    $MUTATION_RESULT"
          case "$RUST_STRESS_RESULT/$TLA_RESULT/$MUTATION_RESULT" in
            *failure*|*cancelled*) exit 1 ;;
            *) exit 0 ;;
          esac
